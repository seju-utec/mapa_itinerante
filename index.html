  subdomains: 'abcd',
  maxZoom: 18
}).addTo(map);

// Grupo de clusters
let clusterGroup = L.markerClusterGroup();
map.addLayer(clusterGroup);

// Preenche o select de cidades
const select = document.getElementById('filtro-cidade');
const cidadesUnicas = [...new Set(localizacoes.map(l => l.city))].sort();
cidadesUnicas.forEach(cidade => {
  const opt = document.createElement('option');
  opt.value = cidade;
  opt.textContent = cidade;
  select.appendChild(opt);
});

function atualizarContador(n) {
  document.getElementById('contador').textContent = n;
}

function renderizarMarcadores(filtro) {
  clusterGroup.clearLayers();
  const lista = filtro
    ? localizacoes.filter(l => l.city === filtro)
    : localizacoes;

  lista.forEach(loc => {
    const marker = L.marker([loc.lat, loc.lng]);
    marker.bindPopup(
      `<strong>${loc.city}</strong><br>${loc.desc}`
    );
    clusterGroup.addLayer(marker);
  });

  atualizarContador(lista.length);

  // Ajusta o zoom para os pontos filtrados
  if (lista.length > 0) {
    const bounds = lista.map(l => [l.lat, l.lng]);
    map.fitBounds(bounds, { padding: [40, 40] });
  }
}

// Carrega todos ao iniciar
renderizarMarcadores('');

// Filtro pelo select
select.addEventListener('change', () => {
  renderizarMarcadores(select.value);
});

// Botão limpar
document.getElementById('btn-limpar').addEventListener('click', () => {
  select.value = '';
  renderizarMarcadores('');
});
